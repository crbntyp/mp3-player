<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>plyr__ Classics you can't find online!</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a2e">

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="plyr">
    <link rel="apple-touch-icon" href="img/assets/icon-192.png">

    <link rel="icon" type="image/png" href="img/assets/fav.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap">
</head>
<body>
    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay">
        <div class="loading-content">
            <svg class="loading-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.5" aria-hidden="true">
                <circle cx="12" cy="12" r="9" />
                <circle cx="12" cy="12" r="3" />
                <path d="M12 3a9 9 0 0 1 9 9" stroke-linecap="round" opacity=".45" />
            </svg>
            <h1 class="loading-title">Loading Player</h1>
            <div class="loading-progress-container">
                <div id="loading-progress-bar" class="loading-progress-bar"></div>
            </div>
            <p id="loading-status" class="loading-status">Loading artwork</p>
        </div>
    </div>

    <div class="player-container">
        <div id="rotate-record" class="rotate-record hidden">
            <img src="img/assets/record.png" alt="Vinyl Record" class="record-image" />
            <div class="record-label">
                <img id="record-label-art" src="" alt="Album Art" class="record-label-art" />
                <svg class="record-label-text" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <path id="circlePathTop" d="M 10, 60 a 50,50 0 0,1 100,0" />
                        <path id="circlePathBottom" d="M 110, 60 a 50,50 0 0,1 -100,0" />
                    </defs>
                    <text class="record-label-title">
                        <textPath id="record-label-title-path" href="#circlePathTop" startOffset="50%" text-anchor="middle">
                            Track Title
                        </textPath>
                    </text>
                    <text class="record-label-artist">
                        <textPath id="record-label-artist-path" href="#circlePathBottom" startOffset="50%" text-anchor="middle">
                            Artist Name
                        </textPath>
                    </text>
                </svg>
            </div>
        </div>
        <div class="album-art-container">
            <img id="album-art"
                 src=""
                 class="album-art"
                 alt="Album Art" />
            <div class="track-info-overlay">
                <h2 id="track-title" class="track-title">No Tracks Loaded</h2>
                <!-- Visualizer Canvas (between title and artist) -->
                <canvas id="visualizer-canvas" class="visualizer-canvas"></canvas>
                <p id="track-artist" class="track-artist"></p>
            </div>

            <!-- Player bar at the bottom of the album art — minimal:
                 [play] [progress] [prev/next]. Shuffle, repeat and
                 volume live in the bottom-right utility cluster outside
                 the player container. -->
            <div class="player-bar">
                <button id="play-btn" class="control-btn control-btn--play" aria-label="Play / pause">
                    <svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M7 5v14l12-7L7 5z" />
                    </svg>
                </button>
                <div class="progress-strip">
                    <span id="current-time" class="progress-time">0:00</span>
                    <div id="progress-container" class="progress-container">
                        <div id="progress-bar" class="progress-bar">
                            <div class="progress-handle"></div>
                        </div>
                    </div>
                    <span id="duration" class="progress-time">0:00</span>
                </div>
                <div class="player-bar-skip">
                    <button id="prev-btn" class="control-btn" aria-label="Previous">
                        <svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M6 6h2v12H6V6zm3 6l10-6v12L9 12z" />
                        </svg>
                    </button>
                    <button id="next-btn" class="control-btn" aria-label="Next">
                        <svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M16 6h2v12h-2V6zM5 6l10 6L5 18V6z" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Utility cluster — fixed bottom-right of the viewport, mirrors
             the era selector at the opposite corner. Holds non-essential
             playback toggles so the player bar stays minimal. -->
        <div class="utility-cluster">
            <button id="shuffle-btn" class="control-btn control-btn--utility" aria-label="Toggle shuffle">
                <svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M16 4l4 4-4 4v-3h-2.5l-2.1 3.1 1.4 2L14.5 17H17v-3l4 4-4 4v-3h-3.5l-2.4-3.4-2.4 3.4H3v-2h4.5l2.4-3.4-2.4-3.4H3V8h4.5l2.4 3.4L12 8h5V4z" />
                </svg>
            </button>
            <button id="repeat-btn" class="control-btn control-btn--utility" data-mode="off" aria-label="Toggle repeat">
                <svg class="control-icon repeat-icon-all" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z" />
                </svg>
                <svg class="control-icon repeat-icon-one" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zm-4-6h-1v4h-1v-3l-1.5 1.1V11l2-1.4h1.5V15z" />
                </svg>
            </button>
            <div class="volume-cluster">
                <button id="volume-btn" class="control-btn control-btn--utility" data-level="high" aria-label="Toggle mute">
                    <svg class="control-icon volume-icon-high" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 00-2.5-4v8a4.5 4.5 0 002.5-4zM14 3.2v2.1a7 7 0 010 13.4v2.1a9 9 0 000-17.6z" />
                    </svg>
                    <svg class="control-icon volume-icon-low" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 00-2.5-4v8a4.5 4.5 0 002.5-4z" />
                    </svg>
                    <svg class="control-icon volume-icon-mute" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 9v6h4l5 4V5L7 9H3zm13.6 7L19 18.4 17.4 20 15 17.6 12.6 20 11 18.4 13.4 16 11 13.6 12.6 12 15 14.4 17.4 12 19 13.6 16.6 16z" />
                    </svg>
                </button>
                <div class="volume-popout">
                    <input id="volume-slider" class="volume-slider" type="range" min="0" max="1" step="0.01" aria-label="Volume" />
                </div>
            </div>
        </div>

        <!-- Era selector — fixed bottom-left of the viewport. Mitsubishi
             three-diamond mark stands in for the era / source switcher. -->
        <div class="era-selector">
            <!-- A record beside a tracklist: this opens the crate. The old
                 three-diamond mark was borrowed from a car badge and said
                 nothing about music. -->
            <button id="era-btn" class="control-btn control-btn--utility" aria-label="Open crate">
                <svg class="control-icon control-icon--stroke" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
                    <circle cx="8" cy="12" r="6.5" />
                    <circle cx="8" cy="12" r="1.5" />
                    <path d="M17.5 6.5h4.5M17.5 12h4.5M17.5 17.5h4.5" />
                </svg>
                <span id="era-label" class="era-label-hidden">Crate</span>
            </button>
            <div id="era-menu" class="era-menu">
                <!-- State A: pick a source / era. -->
                <!-- Drive eras only. The bundled local tracks are still there
                     as an offline fallback (see Player.#openDefaultCrate), but
                     they aren't a place you'd choose to go. -->
                <div class="era-menu-view era-menu-view--eras" data-view="eras">
                    <div class="era-menu-title">Google Drive</div>
                    <!-- Drive folders populated by EraSelector.populateMenu() -->
                </div>

                <!-- State B: track list for the era chosen above. Hidden by
                     default; shown when a folder is picked. -->
                <div class="era-menu-view era-menu-view--tracks" data-view="tracks" hidden>
                    <div class="crate-header">
                        <button id="era-back-btn" class="crate-nav" aria-label="Back to era picker">
                            <svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M15 6l-6 6 6 6 1.4-1.4L11.8 12l4.6-4.6z"/>
                            </svg>
                        </button>
                        <span class="crate-id">
                            <span id="era-tracks-title" class="crate-name">Tracks</span>
                            <span id="era-tracks-count" class="crate-count"></span>
                        </span>
                        <button id="era-refresh-btn" class="crate-nav" aria-label="Refresh listing">
                            <svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M17.65 6.35A8 8 0 1019.73 14h-2.08a6 6 0 11-1.42-6.22L13 11h7V4l-2.35 2.35z"/>
                            </svg>
                        </button>
                    </div>
                    <div class="crate-search">
                        <svg class="crate-search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
                            <circle cx="11" cy="11" r="6" />
                            <path d="M20 20l-4.5-4.5" />
                        </svg>
                        <input id="era-tracks-search" class="crate-search__input" type="search"
                               placeholder="Search this crate" aria-label="Search tracks" />
                    </div>
                    <div id="era-tracks-list" class="era-tracks-list"></div>
                </div>
            </div>
        </div>

        <div class="credit">
            <a href="https://crbntyp.com" class="credit-logo" target="_blank" rel="noopener">crbntyp</a>
        </div>

    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <script type="module" src="./scripts/main.js"></script>

    <!-- Register Service Worker for PWA. Dev-mode skip avoids caching the
         Vite dev bundle, which would mask hot-reloaded changes behind a
         stale install. Re-enabled in production where paths are stable. -->
    <script>
        if ('serviceWorker' in navigator && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('PWA: Service Worker registered'))
                .catch((err) => console.log('PWA: Service Worker failed', err));
        }
    </script>
</body>
</html>
