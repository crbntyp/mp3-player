<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>plyr__ Classics you can't find online!</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0c0c11">

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="plyr">
    <link rel="apple-touch-icon" href="img/assets/icon-192.png">

    <!-- SVG first so the mark stays sharp on any density; the PNG is the
         fallback for browsers that don't take SVG favicons. -->
    <link rel="icon" type="image/svg+xml" href="img/assets/icon.svg">
    <link rel="icon" type="image/png" href="img/assets/fav.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap">
</head>
<body>
    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay">
        <div class="loading-content">
            <svg class="loading-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.5" aria-hidden="true">
                <circle cx="12" cy="12" r="9" />
                <circle cx="12" cy="12" r="3" />
                <path d="M12 3a9 9 0 0 1 9 9" stroke-linecap="round" opacity=".45" />
            </svg>
            <h1 class="loading-title">Loading Player</h1>
            <div class="loading-progress-container">
                <div id="loading-progress-bar" class="loading-progress-bar"></div>
            </div>
            <p id="loading-status" class="loading-status">Starting up</p>
        </div>
    </div>

    <div class="player-container">
        <div id="rotate-record" class="rotate-record hidden">
            <img src="img/assets/record.png" alt="Vinyl Record" class="record-image" />
            <div class="record-label">
                <img id="record-label-art" src="" alt="Album Art" class="record-label-art" />
                <svg class="record-label-text" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <path id="circlePathTop" d="M 10, 60 a 50,50 0 0,1 100,0" />
                        <path id="circlePathBottom" d="M 110, 60 a 50,50 0 0,1 -100,0" />
                    </defs>
                    <text class="record-label-title">
                        <textPath id="record-label-title-path" href="#circlePathTop" startOffset="50%" text-anchor="middle">
                            Track Title
                        </textPath>
                    </text>
                    <text class="record-label-artist">
                        <textPath id="record-label-artist-path" href="#circlePathBottom" startOffset="50%" text-anchor="middle">
                            Artist Name
                        </textPath>
                    </text>
                </svg>
            </div>
        </div>
        <div class="album-art-container">
            <img id="album-art"
                 src=""
                 class="album-art"
                 alt="Album Art" />
            <!-- Favourite toggle. Top-left of the artwork, opposite corner
                 to nothing — the transport lives along the bottom, so the top
                 corners are the only uncontested space on the sleeve. -->
            <button id="fav-btn" class="fav-btn" aria-pressed="false" aria-label="Save to favourites">
                <svg class="fav-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 20.7l-1.5-1.35C5.4 14.75 2 11.7 2 7.95 2 5.4 4 3.4 6.5 3.4c1.4 0 2.8.66 3.7 1.7l1.8 2.06 1.8-2.06c.9-1.04 2.3-1.7 3.7-1.7 2.5 0 4.5 2 4.5 4.55 0 3.75-3.4 6.8-8.5 11.4L12 20.7z"/>
                </svg>
            </button>

            <div class="track-info-overlay">
                <h2 id="track-title" class="track-title">No Tracks Loaded</h2>
                <!-- Visualizer Canvas (between title and artist) -->
                <canvas id="visualizer-canvas" class="visualizer-canvas"></canvas>
                <p id="track-artist" class="track-artist"></p>
            </div>

            <!-- Player bar at the bottom of the album art:
                 [play] [progress] [prev/next] [volume].

                 Volume used to live in a fixed cluster in the corner of the
                 viewport, which anchored it to the window rather than to the
                 player it controls. It's a transport control, so it belongs on
                 the transport. It's hidden on touch devices — iOS Safari makes
                 HTMLMediaElement.volume read-only, so the slider there moves
                 without changing anything. -->
            <div class="player-bar">
                <button id="play-btn" class="control-btn control-btn--play" aria-label="Play / pause">
                    <svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M7 5v14l12-7L7 5z" />
                    </svg>
                </button>
                <div class="progress-strip">
                    <span id="current-time" class="progress-time">0:00</span>
                    <div id="progress-container" class="progress-container">
                        <div id="progress-bar" class="progress-bar">
                            <div class="progress-handle"></div>
                        </div>
                    </div>
                    <span id="duration" class="progress-time">0:00</span>
                </div>
                <div class="player-bar-skip">
                    <button id="prev-btn" class="control-btn" aria-label="Previous">
                        <svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M6 6h2v12H6V6zm3 6l10-6v12L9 12z" />
                        </svg>
                    </button>
                    <button id="next-btn" class="control-btn" aria-label="Next">
                        <svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M16 6h2v12h-2V6zM5 6l10 6L5 18V6z" />
                        </svg>
                    </button>
                </div>
                <div class="volume-cluster">
                    <button id="volume-btn" class="control-btn volume-btn" data-level="high" aria-label="Toggle mute">
                        <svg class="control-icon volume-icon-high" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 00-2.5-4v8a4.5 4.5 0 002.5-4zM14 3.2v2.1a7 7 0 010 13.4v2.1a9 9 0 000-17.6z" />
                        </svg>
                        <svg class="control-icon volume-icon-low" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 00-2.5-4v8a4.5 4.5 0 002.5-4z" />
                        </svg>
                        <svg class="control-icon volume-icon-mute" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M3 9v6h4l5 4V5L7 9H3zm13.6 7L19 18.4 17.4 20 15 17.6 12.6 20 11 18.4 13.4 16 11 13.6 12.6 12 15 14.4 17.4 12 19 13.6 16.6 16z" />
                        </svg>
                    </button>
                    <div class="volume-popout">
                        <input id="volume-slider" class="volume-slider" type="range" min="0" max="1" step="0.01" aria-label="Volume" />
                    </div>
                </div>
            </div>
        </div>

        <!-- The wordmark is outlines, not text.
             It used to be Britanica at 48px with clip-path: inset(0 0 N%),
             but that percentage is of the line box, which has no fixed
             relationship to the letterforms — the glyphs sit 6.1..45.8px
             inside a 48px box with a 21.6px x-height, so the same percentage
             cuts differently at any other size, and lands somewhere else
             entirely when the webfont fails and Arial stands in.

             As paths the cut is part of the shape: identical everywhere, no
             font to download (Britanica was loaded for this one word), and
             it can't drift. Regenerate with scripts/build-wordmark.py. -->
        <div class="credit">
            <a href="https://crbntyp.com" class="credit-logo" target="_blank" rel="noopener" aria-label="crbntyp">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -781 3229 565.0" role="img" aria-label="crbntyp">
                  <title>crbntyp</title>
                  <path fill="currentColor" d="M18 -228Q18 -332 83.0 -396.0Q148 -460 261 -460Q320 -460 364.5 -444.0Q409 -428 430.5 -405.5Q452 -383 465.5 -360.5Q479 -338 482 -322L484 -306H369L367 -314Q365 -318 357.5 -329.5Q350 -341 339.5 -350.0Q329 -359 308.0 -366.0Q287 -373 261 -373Q199 -373 165.5 -333.5Q132 -294 132.0 -228.0Q132 -162 165.5 -119.5Q199 -77 261 -77Q302 -77 329.0 -98.5Q356 -120 362 -141L369 -162H484Q483 -155 481.0 -143.5Q479 -132 465.0 -102.5Q451 -73 429.5 -50.0Q408 -27 363.5 -8.5Q319 10 261 10Q146 10 82.0 -54.0Q18 -118 18 -228Z M643 -450V-382Q684 -450 764 -450H817V-356H767Q692 -356 669.5 -322.0Q647 -288 646 -180V0H536V-450Z M981 -643V-392Q1032 -456 1118 -459Q1124 -459 1131 -459Q1237 -459 1300.0 -394.0Q1363 -329 1363 -223Q1363 -115 1299.5 -52.5Q1236 10 1135 10Q1124 10 1113 9Q1028 5 978 -64V0H871V-643ZM1015 -118Q1050 -78 1112 -78Q1173 -78 1211.5 -118.0Q1250 -158 1250 -223Q1250 -292 1212.0 -332.0Q1174 -372 1112.0 -372.0Q1050 -372 1014.5 -334.0Q979 -296 979 -225Q979 -158 1015 -118Z M1417 -450H1523V-381Q1567 -459 1660 -460Q1664 -460 1668 -460Q1772 -460 1818.5 -405.0Q1865 -350 1865 -242V0H1755V-242Q1755 -308 1731.0 -338.5Q1707 -369 1655 -370Q1653 -370 1652 -370Q1589 -370 1558.0 -331.5Q1527 -293 1527 -213V0H1417Z M1902 -356V-450H1962V-581H2073V-450H2182V-356H2073V-124Q2073 -107 2079.0 -100.5Q2085 -94 2102 -94H2182V0H2102Q2024 0 1993.0 -25.5Q1962 -51 1962 -124V-356Z M2208 -450H2324L2443 -133L2567 -450H2683L2476 59Q2460 98 2451.0 115.0Q2442 132 2424.5 151.0Q2407 170 2383.0 176.5Q2359 183 2321 183H2244V89H2321Q2343 89 2350.0 84.0Q2357 79 2367 59L2393 -7Z M2719 -450H2826V-388Q2876 -456 2965 -459Q2971 -459 2978 -459Q3084 -459 3147.5 -394.0Q3211 -329 3211 -223Q3211 -115 3147.0 -52.5Q3083 10 2982 10Q2971 10 2960 9Q2879 5 2829 -60V183H2719ZM2826 -225Q2826 -158 2862.0 -118.0Q2898 -78 2960 -78Q3020 -78 3059.0 -118.0Q3098 -158 3098 -223Q3098 -292 3060.0 -332.0Q3022 -372 2960 -372Q2897 -372 2861.5 -334.0Q2826 -296 2826 -225Z"/>
                </svg>
            </a>
        </div>

        <!-- Records launcher — centred at the base of the player column.
             It used to be fixed to the bottom-left of the viewport, which on a
             wide display put it several hundred pixels from the player it
             opens; the two could never read as related because one was
             anchored to the window and the other to the page. In the column it
             inherits the player's centring, so desktop and mobile are the same
             layout at different widths rather than two sets of rules. -->
        <div class="records-launch">
            <button id="records-btn" class="records-launch__btn" aria-haspopup="dialog"
                    aria-expanded="false" aria-controls="records-sheet-el">
                <svg class="records-launch__icon" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
                    <circle cx="8" cy="12" r="6.5" />
                    <circle cx="8" cy="12" r="1.5" />
                    <path d="M17.5 6.5h4.5M17.5 12h4.5M17.5 17.5h4.5" />
                </svg>
                <span class="records-launch__label">Records</span>
            </button>
        </div>

    </div>

    <!-- Records sheet.
         One component, two anchorings: a bottom sheet on mobile (full width,
         grab handle, dimmed scrim) and a centred panel on desktop. It's a
         sibling of .player-container rather than a child of the button,
         because it's no longer hinged to a corner — it belongs to the
         viewport, and nesting it would have trapped it inside the player's
         stacking context and 465px width.

         There is no era-picker step any more. It used to be a drill-down —
         pick an era, then see its tracks — which cost a tap on every visit
         and hid which era you were in once you were in it. The eras are now
         a scrolling chip row pinned above the list, so you land on tracks and
         can always see where you are. -->
    <div id="records-scrim" class="records-scrim" hidden></div>
    <div id="records-sheet-el" class="records-sheet" role="dialog" aria-modal="true"
         aria-label="Records" hidden>
        <div class="records-sheet__grab" aria-hidden="true"></div>

        <div class="records-header">
            <span class="records-id">
                <span id="records-title" class="records-name">Records</span>
                <span id="records-count-el" class="records-count"></span>
            </span>
            <button id="records-refresh-btn" class="records-nav" aria-label="Refresh listing">
                <svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M17.65 6.35A8 8 0 1019.73 14h-2.08a6 6 0 11-1.42-6.22L13 11h7V4l-2.35 2.35z"/>
                </svg>
            </button>
            <button id="records-close-btn" class="records-nav" aria-label="Close records">
                <svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M18.3 5.7L12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7l1.4-1.4 6.3 6.3 6.3-6.3z"/>
                </svg>
            </button>
        </div>

        <!-- Era chips. Populated by EraSelector.populateMenu(). -->
        <div id="records-eras" class="records-eras" role="tablist" aria-label="Choose an era"></div>

        <div class="records-tools">
            <div class="records-search">
                <svg class="records-search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="6" />
                    <path d="M20 20l-4.5-4.5" />
                </svg>
                <input id="records-search-input" class="records-search__input" type="search"
                       placeholder="Search these records" aria-label="Search tracks" />
            </div>
            <!-- Shuffle is a property of the era, not of the transport, so
                 it sits with the era rather than floating near the player. -->
            <button id="shuffle-btn" class="records-toggle" aria-pressed="false" aria-label="Shuffle these records">
                <svg class="records-toggle__icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M16 4l4 4-4 4v-3h-2.5l-2.1 3.1 1.4 2L14.5 17H17v-3l4 4-4 4v-3h-3.5l-2.4-3.4-2.4 3.4H3v-2h4.5l2.4-3.4-2.4-3.4H3V8h4.5l2.4 3.4L12 8h5V4z" />
                </svg>
                <span class="records-toggle__label">Shuffle</span>
            </button>
        </div>

        <!-- Import / export. Only rendered for the Favourites view, and the
             export half only when there is something to export. Import stays
             reachable from the empty state on purpose: a fresh browser has no
             list, and hiding import there would make the feature impossible
             to use on the browser that most needs it. -->
        <p id="fav-warning" class="fav-warning" hidden></p>

        <div id="fav-tools" class="fav-tools" hidden>
            <button id="fav-export-btn" class="fav-tool" type="button">
                <svg class="fav-tool__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 3v12M8 11l4 4 4-4M4 20h16"/>
                </svg>
                <span>Export</span>
            </button>
            <button id="fav-import-btn" class="fav-tool" type="button">
                <svg class="fav-tool__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 15V3M8 7l4-4 4 4M4 20h16"/>
                </svg>
                <span>Import</span>
            </button>
            <input id="fav-import-file" type="file" accept="application/json,.json" hidden>
        </div>

        <div id="records-list" class="records-list"></div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <script type="module" src="./scripts/main.js"></script>

    <!-- Register Service Worker for PWA. Dev-mode skip avoids caching the
         Vite dev bundle, which would mask hot-reloaded changes behind a
         stale install. Re-enabled in production where paths are stable. -->
    <script>
        if ('serviceWorker' in navigator && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('PWA: Service Worker registered'))
                .catch((err) => console.log('PWA: Service Worker failed', err));
        }
    </script>
    <!-- stts Analytics -->
    <script src="/stts/tracker/stts.min.js" data-site="plyr" async defer></script>
</body>
</html>
