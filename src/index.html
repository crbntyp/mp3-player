<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>plyr__ Classics you can't find online!</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a2e">

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="plyr">
    <link rel="apple-touch-icon" href="img/assets/icon-192.png">

    <link rel="icon" type="image/png" href="img/assets/fav.png">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="https://use.typekit.net/abs2nmm.css">
</head>
<body>
    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay">
        <div class="loading-content">
            <i class="las la-compact-disc loading-icon"></i>
            <h1 class="loading-title">Loading Player</h1>
            <div class="loading-progress-container">
                <div id="loading-progress-bar" class="loading-progress-bar"></div>
            </div>
            <p id="loading-status" class="loading-status">Loading cover images... 0/7</p>
        </div>
    </div>

    <div class="player-container">
        <div id="rotate-record" class="rotate-record hidden">
            <img src="img/assets/record.png" alt="Vinyl Record" class="record-image" />
            <div class="record-label">
                <img id="record-label-art" src="" alt="Album Art" class="record-label-art" />
                <svg class="record-label-text" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <path id="circlePathTop" d="M 10, 60 a 50,50 0 0,1 100,0" />
                        <path id="circlePathBottom" d="M 110, 60 a 50,50 0 0,1 -100,0" />
                    </defs>
                    <text class="record-label-title">
                        <textPath id="record-label-title-path" href="#circlePathTop" startOffset="50%" text-anchor="middle">
                            Track Title
                        </textPath>
                    </text>
                    <text class="record-label-artist">
                        <textPath id="record-label-artist-path" href="#circlePathBottom" startOffset="50%" text-anchor="middle">
                            Artist Name
                        </textPath>
                    </text>
                </svg>
            </div>
        </div>
        <div class="album-art-container">
            <img id="album-art"
                 src=""
                 class="album-art"
                 alt="Album Art" />
            <div class="track-info-overlay">
                <h2 id="track-title" class="track-title">No Tracks Loaded</h2>
                <!-- Visualizer Canvas (between title and artist) -->
                <canvas id="visualizer-canvas" class="visualizer-canvas"></canvas>
                <p id="track-artist" class="track-artist"></p>
            </div>
        </div>

        <div class="progress-container-wrapper">
            <span id="current-time" class="progress-time">0:00</span>
            <div id="progress-container" class="progress-container">
                <div id="progress-bar" class="progress-bar">
                    <div class="progress-handle"></div>
                </div>
            </div>
            <span id="duration" class="progress-time">0:00</span>
        </div>

        <div class="player-controls">
            <button id="prev-btn" class="control-btn control-btn--small">
                <i class="las la-backward"></i>
            </button>
            <button id="play-btn" class="control-btn control-btn--large">
                <i class="las la-play"></i>
            </button>
            <button id="next-btn" class="control-btn control-btn--small">
                <i class="las la-forward"></i>
            </button>
            <button id="library-btn" class="control-btn control-btn--small">
                <i class="las la-bars"></i>
            </button>
        </div>

        <!-- Era Selector -->
        <div class="era-selector">
            <button id="era-btn" class="era-btn">
                <i class="las la-folder-open"></i>
                <span id="era-label">Select Era</span>
            </button>
            <div id="era-menu" class="era-menu">
                <button class="era-option" data-source="local">
                    <i class="las la-music"></i>
                    <span>Local Tracks</span>
                </button>
                <div class="era-divider"></div>
                <div class="era-menu-title">Google Drive</div>
                <!-- Drive folders populated by JavaScript -->
            </div>
        </div>

        <div class="credit">
            <span class="credit-logo">crbntyp</span>
        </div>

    </div>

    <!-- Track Wheel Overlay -->
    <div id="track-wheel-overlay" class="track-wheel-overlay">
        <button id="wheel-close" class="wheel-close">
            <i class="las la-times"></i>
        </button>
        <div class="track-wheel-container">
            <div id="track-wheel" class="track-wheel">
                <!-- Track items populated by JavaScript -->
            </div>
        </div>
        <p class="wheel-hint">Scroll to browse • Click to play</p>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <script src="scripts/visualizer.js"></script>
    <script src="scripts/drive.js"></script>
    <script src="scripts/main.js"></script>

    <!-- Register Service Worker for PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('PWA: Service Worker registered'))
                .catch((err) => console.log('PWA: Service Worker failed', err));
        }
    </script>
</body>
</html>
