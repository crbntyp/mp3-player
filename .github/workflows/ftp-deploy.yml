name: Deploy to FTP

on:
  push:
    branches:
      - master
      - claude/**  # Allow deployment from Claude branches for testing

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Deploy to FTP via lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp
          cat > ftp-script.txt << 'FTPEOF'
          set ftp:ssl-allow no
          open ${{ secrets.FTP_SERVER }}
          user ${{ secrets.FTP_USERNAME }} ${{ secrets.FTP_PASSWORD }}
          mirror --reverse --delete --verbose --exclude .git/ --exclude node_modules/ ./dist/ public_html/carbontype.co/player/
          bye
          FTPEOF
          lftp -f ftp-script.txt
